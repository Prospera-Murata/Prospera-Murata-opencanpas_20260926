            overflow: hidden;

            border: 4px solid #f472b6;

    <script>
        class SoundEngine {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AC();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playPop(freq = 600) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }
            playCatch() {
                if (!this.ctx) return;
                const notes = [587.33, 739.99, 880.00, 1174.66];
                notes.forEach((f, i) => {
                    setTimeout(() => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(f, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                        osc.connect(gain); gain.connect(this.ctx.destination);
                        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
                    }, i * 75);
                });
            }
            playSplash() {
                if (!this.ctx) return;
                const dur = 0.3;
                const bufSize = this.ctx.sampleRate * dur;
                const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                const src = this.ctx.createBufferSource();
                src.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                src.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                src.start();
            }
            playBell() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        function spawnEntities() {
            for (let i = 0; i < 14; i++) {

        function spawnFishes() {
            fishes.forEach(f => {
                scene.remove(f.mesh);
                if (f.shadowMesh) scene.remove(f.shadowMesh);
            });
            fishes = [];

            const fishTypes = ['fish_small', 'fish_large', 'fish_salmon', 'fish_clown', 'fish_tuna'];

            for (let i = 0; i < 10; i++) {
                let ang = Math.random() * Math.PI * 2;
                let rad = 24 + Math.random() * 6;
                let type = fishTypes[Math.floor(Math.random() * fishTypes.length)];
                let db = ITEMS_DB[type];

                let scale = db.size === 'xlarge' ? 1.6 : (db.size === 'medium' ? 1.0 : 0.7);

                const mesh = new THREE.Mesh(
                    new THREE.ConeGeometry(0.35 * scale, 0.9 * scale, 8),
                    new THREE.MeshStandardMaterial({ color: db.size === 'xlarge' ? 0x1e293b : (db.size === 'medium' ? 0xf43f5e : 0xf472b6), roughness: 0.3 })

                mesh.position.set(Math.cos(ang) * rad, -2.0, Math.sin(ang) * rad);
                scene.add(mesh);

                const shadowMesh = new THREE.Mesh(
                    new THREE.RingGeometry(0.2 * scale, 0.5 * scale, 12),
                    new THREE.MeshBasicMaterial({ color: 0x01579b, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })

                fishes.push({
                    mesh: mesh,
                    shadowMesh: shadowMesh,
                    type: type,
                    angle: ang,
                    radius: rad,
                    speed: 0.008 + Math.random() * 0.012

                scene.add(mesh);
                bugs.push({ mesh: mesh, type: Math.random() < 0.7 ? 'bug_butterfly' : 'bug_beetle', vx: (Math.random() - 0.5) * 0.04, vz: (Math.random() - 0.5) * 0.04 });

        window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') performAction(); });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let touchId = null;

        joystickZone.addEventListener('touchstart', e => {
            const touch = e.changedTouches[0];
            touchId = touch.identifier;
            updateJoystick(touch);
        });
        window.addEventListener('touchmove', e => {
            if (touchId !== null) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === touchId) updateJoystick(e.changedTouches[i]);
                }
            }
        });
        window.addEventListener('touchend', e => {
            if (touchId !== null) {
                touchId = null;
                joystickVector = { x: 0, y: 0 };
                joystickKnob.style.transform = `translate(0px, 0px)`;
            }
        });

        function updateJoystick(touch) {
            const rect = joystickZone.getBoundingClientRect();
            let dx = touch.clientX - (rect.left + rect.width / 2);
            let dy = touch.clientY - (rect.top + rect.height / 2);
            const dist = Math.hypot(dx, dy);
            const maxDist = 42;
            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joystickVector = { x: dx / maxDist, y: dy / maxDist };
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            if (minigameActive) {
                minigameData.markerPos += minigameData.markerDir * delta * 85;
                if (minigameData.markerPos > 100 || minigameData.markerPos < 0) minigameData.markerDir *= -1;
                document.getElementById('minigame-marker').style.left = `${minigameData.markerPos}%`;
                renderer.render(scene, camera);
                return;
            }

            let moveX = 0, moveZ = 0;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) moveX -= 1;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) moveX += 1;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) moveZ -= 1;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) moveZ += 1;
            if (joystickVector.x !== 0 || joystickVector.y !== 0) { moveX = joystickVector.x; moveZ = joystickVector.y; }

            if (moveX !== 0 || moveZ !== 0) {
                const angle = Math.atan2(moveX, moveZ);
                playerGroup.rotation.y = angle;
                const speed = 7.5 * delta;
                let nx = playerGroup.position.x + Math.sin(angle) * speed;
                let nz = playerGroup.position.z + Math.cos(angle) * speed;

                if (inInterior) {
                    if (Math.abs(nx) < 4.2 && Math.abs(nz) < 4.2) { playerGroup.position.x = nx; playerGroup.position.z = nz; }
                } else {
                    if (Math.hypot(nx, nz) < 26) { playerGroup.position.x = nx; playerGroup.position.z = nz; }
                }

                const waddle = Math.sin(time * 14) * 0.5;
                const headBob = Math.abs(Math.sin(time * 14)) * 0.08;
                if (leftArm && rightArm && leftLeg && rightLeg && chibiHead) {
                    leftArm.rotation.x = waddle; rightArm.rotation.x = -waddle;
                    leftLeg.rotation.x = -waddle; rightLeg.rotation.x = waddle;
                    chibiHead.position.y = headBob;
                }
            } else {
                const breath = Math.sin(time * 3.5) * 0.03;
                if (leftArm && rightArm && leftLeg && rightLeg && chibiHead) {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                    chibiHead.position.y = breath;
                }
            }

            fishes.forEach(f => {
                f.angle += f.speed * delta * 15;
                f.mesh.position.x = Math.cos(f.angle) * f.radius;
                f.mesh.position.z = Math.sin(f.angle) * f.radius;
                f.mesh.rotation.y = -f.angle + Math.PI / 2;
                if (f.shadowMesh) {
                    f.shadowMesh.position.x = f.mesh.position.x;
                    f.shadowMesh.position.z = f.mesh.position.z;
                }
            });

            updateEnvironment();

            // STABLE CAMERA (Zero shaking / bobbing)
            if (!inInterior) {
                camera.position.x += (playerGroup.position.x - camera.position.x) * 0.08;
                camera.position.z += (playerGroup.position.z + 26 - camera.position.z) * 0.08;
                camera.lookAt(playerGroup.position.x, 1, playerGroup.position.z);
            } else {
                camera.position.set(0, 7.5, 11);
                camera.lookAt(0, 1, 0);
            }

            renderer.render(scene, camera);
        }

        function updateEnvironment() {
            gameTime = (gameTime + 0.12) % (24 * 60);
            const h = Math.floor(gameTime / 60).toString().padStart(2, '0');
            const m = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById('hud-time').innerText = `${h}:${m}`;

            const hour = gameTime / 60;
            const sunAngle = (hour / 24) * Math.PI * 2 - Math.PI / 2;
            sunLight.position.set(Math.cos(sunAngle) * 50, Math.sin(sunAngle) * 50, 25);

            if (hour > 6 && hour < 18) {
                scene.background.setHex(0xfbcfe8); scene.fog.color.setHex(0xfbcfe8); sunLight.intensity = 1.1;
            } else {
                scene.background.setHex(0x1e1b4b); scene.fog.color.setHex(0x1e1b4b); sunLight.intensity = 0.25;
            }

            bugs.forEach(b => {
                b.mesh.position.x += b.vx; b.mesh.position.z += b.vz;
                if (Math.hypot(b.mesh.position.x, b.mesh.position.z) > 24) { b.vx *= -1; b.vz *= -1; }
            });

            farmPlots.forEach(plot => {
                if (plot.state === 'planted') {
                    plot.growthProgress += 0.005;
                    if (plot.growthProgress >= 1.0) {
                        plot.state = 'ready';
                        if (plot.cropMesh) scene.remove(plot.cropMesh);
                        const cropGeo = new THREE.DodecahedronGeometry(0.45);
                        let colorHex = plot.cropType === 'carrot' ? 0xf97316 : (plot.cropType === 'tomato' ? 0xef4444 : 0xeab308);
                        const cropMat = new THREE.MeshStandardMaterial({ color: colorHex });
                        plot.cropMesh = new THREE.Mesh(cropGeo, cropMat);
                        plot.cropMesh.position.set(plot.x, 0.4, plot.z);
                        scene.add(plot.cropMesh);
                    }
                }
            });
        }

        function performAction() {
            const pPos = playerGroup.position;

            if (inInterior) {
                if (pPos.distanceTo(new THREE.Vector3(0, 0, 4.2)) < 2.0) { exitHouse(); return; }
                showToast('🏠 お部屋の中ではかわいい家具が置けるよ！', '');
                return;
            }

            const nearBuilding = worldObjects.find(obj => obj.position.distanceTo(pPos) < 3.5);
            if (nearBuilding) {
                if (nearBuilding.userData.type === 'player_house') { enterHouse(); return; }
                if (nearBuilding.userData.type === 'museum') { openMuseumModal(); return; }
                if (nearBuilding.userData.type === 'shop') { openShopModal(); return; }
            }

            if (playerState.activeTool === 'hoe') {
                const nearPlot = farmPlots.find(p => Math.hypot(p.x - pPos.x, p.z - pPos.z) < 1.8);
                if (nearPlot && nearPlot.state === 'empty') {
                    nearPlot.state = 'tilled';
                    nearPlot.mesh.material.color.setHex(0x78350f);
                    audio.playPop(550);
                    showToast('🌾 畑をきれいに耕したよ！', '');
                } else { showToast('🌾 耕せる畑の近くで使ってね！', ''); }
                return;
            }

            if (playerState.activeTool === 'seed') {
                const nearPlot = farmPlots.find(p => Math.hypot(p.x - pPos.x, p.z - pPos.z) < 1.8);
                if (nearPlot && nearPlot.state === 'tilled') {
                    let seedItem = playerState.inventory.find(i => ITEMS_DB[i.id]?.category === 'seed');
                    if (seedItem && seedItem.count > 0) {
                        seedItem.count--;
                        if (seedItem.count === 0) playerState.inventory = playerState.inventory.filter(i => i.id !== seedItem.id);
                        
                        let cropType = ITEMS_DB[seedItem.id].cropType || 'carrot';
                        nearPlot.state = 'planted';
                        nearPlot.cropType = cropType;
                        nearPlot.growthProgress = 0;

                        const sproutGeo = new THREE.BoxGeometry(0.2, 0.3, 0.2);
                        const sproutMat = new THREE.MeshStandardMaterial({ color: 0x22c55e });
                        nearPlot.cropMesh = new THREE.Mesh(sproutGeo, sproutMat);
                        nearPlot.cropMesh.position.set(nearPlot.x, 0.25, nearPlot.z);
                        scene.add(nearPlot.cropMesh);

                        audio.playPop(650);
                        showToast('🌱 タネをまいたよ！スクスク育つのが楽しみ！', '');
                    } else { showToast('🌱 タネを持っていないよ！DIYでクラフトしよう！', ''); }
                } else { showToast('🌱 耕された畑の近くで使ってね！', ''); }
                return;
            }

            if (playerState.activeTool === 'path') { placePathTile(pPos.x, pPos.z); return; }
            if (playerState.activeTool === 'fence') { placeFence(pPos.x, pPos.z); return; }

            const readyPlot = farmPlots.find(p => Math.hypot(p.x - pPos.x, p.z - pPos.z) < 1.8 && p.state === 'ready');
            if (readyPlot) {
                audio.playCatch();
                let harvestedId = `crop_${readyPlot.cropType}`;
                addItem(harvestedId, 1);
                scene.remove(readyPlot.cropMesh);
                readyPlot.cropMesh = null;
                readyPlot.state = 'empty';
                readyPlot.mesh.material.color.setHex(0xa16207);
                showToast('✨ 作物を収穫したよ！', ITEMS_DB[harvestedId].name);
                return;
            }

            if (playerState.activeTool === 'rod') {
                const nearFish = fishes.find(f => f.mesh.position.distanceTo(pPos) < 5.5);
                if (nearFish) {
                    startMiniGame('fish', nearFish);
                } else { showToast('🌊 近くに魚影がないみたい…', ''); }
            } else if (playerState.activeTool === 'net') {
                const nearBug = bugs.find(b => b.mesh.position.distanceTo(pPos) < 3.8);
                if (nearBug) {
                    startMiniGame('bug', nearBug);
                } else { showToast('🍃 近くに虫がいないよ！', ''); }
            } else if (playerState.activeTool === 'shovel') {
                const nearFossil = fossils.find(f => f.position.distanceTo(pPos) < 3.2);
                if (nearFossil) {
                    audio.playCatch();
                    addItem('fossil'); playerState.critterpedia['fossil'] = true;
                    showToast('🦴 かせきをほりあてた！', '');
                    scene.remove(nearFossil);
                    fossils = fossils.filter(f => f !== nearFossil);
                } else { showToast('🪵 ここには何もないみたい', ''); }
            } else {
                const nearTree = trees.find(t => t.position.distanceTo(pPos) < 3.2);
                if (nearTree && nearTree.userData.hasFruit) {
                    audio.playPop(520);
                    nearTree.userData.hasFruit = false;
                    nearTree.userData.fruitMesh.visible = false;
                    addItem('apple'); addItem('wood');
                    showToast('🍎 リンゴともくざいをゲット！', '');
                } else { showToast('✋ 道具を選んでアクションしてね！', ''); }
            }
        }

        function startMiniGame(type, entity) {
            minigameActive = true;
            minigameData = { type: type, targetEntity: entity, markerPos: 0, markerDir: 1, targetMin: 30 + Math.random() * 20, targetMax: 60 + Math.random() * 20 };
            document.getElementById('minigame-target.style')
            const targetEl = document.getElementById('minigame-target');
            targetEl.style.left = `${minigameData.targetMin}%`;
            targetEl.style.width = `${minigameData.targetMax - minigameData.targetMin}%`;
            document.getElementById('minigame-title').innerText = type === 'fish' ? '🎣 釣りチャレンジ！' : '🦋 虫捕りチャレンジ！';
            document.getElementById('minigame-overlay').classList.remove('hidden');
        }

        document.getElementById('btn-timing').addEventListener('click', () => {
            if (!minigameActive) return;
            minigameActive = false;
            document.getElementById('minigame-overlay').classList.add('hidden');

            if (minigameData.markerPos >= minigameData.targetMin && minigameData.markerPos <= minigameData.targetMax) {
                audio.playSplash(); audio.playCatch();
                let ent = minigameData.targetEntity;
                if (minigameData.type === 'fish') {
                    addItem(ent.type); playerState.critterpedia[ent.type] = true;
                    showToast('🎉 大成功！魚を釣り上げた！', ITEMS_DB[ent.type].name);
                    scene.remove(ent.mesh);
                    if (ent.shadowMesh) scene.remove(ent.shadowMesh);
                    fishes = fishes.filter(f => f !== ent);
                } else {
                    addItem(ent.type); playerState.critterpedia[ent.type] = true;
                    showToast('🎉 大成功！虫をゲットした！', ITEMS_DB[ent.type].name);
                    scene.remove(ent.mesh);
                    bugs = bugs.filter(b => b !== ent);
                }
            } else {
                audio.playPop(300);
                showToast('💦 ざんねん！タイミングがずれて逃げられてしまった…', '');
            }
        });

        function enterHouse() {
            inInterior = true;
            audio.playPop(700);

            scene.background.setHex(0xfce7f3);
            scene.fog.color.setHex(0xfce7f3);
            islandMesh.visible = false;
            oceanMesh.visible = false;
            trees.forEach(t => t.visible = false);
            rocks.forEach(r => r.visible = false);
            fossils.forEach(f => f.visible = false);
            fishes.forEach(f => { f.mesh.visible = false; if (f.shadowMesh) f.shadowMesh.visible = false; });
            bugs.forEach(b => b.mesh.visible = false);
            worldObjects.forEach(o => o.visible = false);
            farmPlots.forEach(p => { p.mesh.visible = false; if (p.cropMesh) p.cropMesh.visible = false; });

            const roomGeo = new THREE.BoxGeometry(9, 6, 9);
            const roomMat = new THREE.MeshStandardMaterial({ color: 0xfff0f5, side: THREE.BackSide });
            const room = new THREE.Mesh(roomGeo, roomMat);
            room.position.y = 3;
            scene.add(room);
            interiorObjects.push(room);

            playerGroup.position.set(0, 0, 3);
            showToast('🏠 パステルハウスに入ったよ！', '');
        }

        function exitHouse() {
            inInterior = false;
            audio.playPop(500);

            scene.background.setHex(0xfbcfe8);
            scene.fog.color.setHex(0xfbcfe8);
            islandMesh.visible = true;
            oceanMesh.visible = true;
            trees.forEach(t => t.visible = true);
            rocks.forEach(r => r.visible = true);
            fossils.forEach(f => f.visible = true);
            fishes.forEach(f => { f.mesh.visible = true; if (f.shadowMesh) f.shadowMesh.visible = true; });
            bugs.forEach(b => b.mesh.visible = false);
            worldObjects.forEach(o => o.visible = true);
            farmPlots.forEach(p => { p.mesh.visible = true; if (p.cropMesh) p.cropMesh.visible = true; });

            interiorObjects.forEach(obj => scene.remove(obj));
            interiorObjects = [];

            playerGroup.position.set(10, 0, -6);
            showToast('🌸 外に出たよ！', '');
        }

        function placePathTile(x, z) {
            let tileItem = playerState.inventory.find(i => i.id === 'path_tile');
            if (tileItem && tileItem.count > 0) {
                tileItem.count--;
                const pathGeo = new THREE.PlaneGeometry(1.2, 1.2);
                const pathMat = new THREE.MeshStandardMaterial({ color: 0xfbcfe8, roughness: 0.9 });
                const pathMesh = new THREE.Mesh(pathGeo, pathMat);
                pathMesh.rotation.x = -Math.PI / 2;
                pathMesh.position.set(Math.round(x), -1.78, Math.round(z));
                scene.add(pathMesh);
                paths.push(pathMesh);
                audio.playPop(650);
                showToast('🧱 タイルをかわいく敷いたよ！', '');
            } else { showToast('❌ パステルタイルが足りないよ！', ''); }
        }

        function placeFence(x, z) {
            let fenceItem = playerState.inventory.find(i => i.id === 'fence_item');
            if (fenceItem && fenceItem.count > 0) {
                fenceItem.count--;
                const fenceGeo = new THREE.BoxGeometry(1.2, 0.7, 0.3);
                const fenceMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                const fenceMesh = new THREE.Mesh(fenceGeo, fenceMat);
                fenceMesh.position.set(Math.round(x), 0.35, Math.round(z));
                fenceMesh.castShadow = true;
                scene.add(fenceMesh);
                fences.push(fenceMesh);
                audio.playPop(600);
                showToast('🏡 フェンスを置いたよ！', '');
            } else { showToast('❌ フェンスがないよ！', ''); }
        }

        function addItem(id, count = 1) {
            let inv = playerState.inventory.find(i => i.id === id);
            if (inv) inv.count += count;
            else playerState.inventory.push({ id: id, count: count });
        }

        document.getElementById('btn-customize').addEventListener('click', () => {
            document.getElementById('modal-customize').classList.remove('hidden');
        });
        document.getElementById('close-customize').addEventListener('click', () => {
            document.getElementById('modal-customize').classList.add('hidden');
        });

        window.setEars = function(type) {
            playerState.earsType = type;
            rebuildChibiModel();
            audio.playPop(750);
            showToast('🎀 コーデを変更したよ！', '');
        };
        window.setHoodieColor = function(color) {
            playerState.hoodieColor = color;
            rebuildChibiModel();
            audio.playPop(700);
            showToast('👚 パーカーの色を変えたよ！', '');
        };
        window.setHairColor = function(color) {
            playerState.hairColor = color;
            rebuildChibiModel();
            audio.playPop(650);
            showToast('💇 髪色を変えたよ！', '');
        };

        document.getElementById('btn-inventory').addEventListener('click', () => {
            renderInventory();
            document.getElementById('modal-inventory').classList.remove('hidden');
        });
        document.getElementById('close-inventory').addEventListener('click', () => {
            document.getElementById('modal-inventory').classList.add('hidden');
        });

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            playerState.inventory.forEach(item => {
                const db = ITEMS_DB[item.id] || { name: item.id, icon: '📦' };
                const el = document.createElement('div');
                el.className = 'bg-pink-50 border-2 border-pink-300 rounded-2xl p-2 flex flex-col items-center justify-center relative shadow';
                el.innerHTML = `
                    <span class="text-3xl">${db.icon}</span>
                    <span class="text-[10px] font-black text-pink-900 mt-1">${db.name}</span>
                    <span class="absolute top-1 right-1 bg-pink-400 text-white font-black text-[10px] px-1.5 py-0.5 rounded-full">x${item.count}</span>
                `;
                grid.appendChild(el);
            });
        }

        document.getElementById('btn-craft').addEventListener('click', () => {
            renderCraft();
            document.getElementById('modal-craft').classList.remove('hidden');
        });
        document.getElementById('close-craft').addEventListener('click', () => {
            document.getElementById('modal-craft').classList.add('hidden');
        });

        function renderCraft() {
            const list = document.getElementById('craft-list');
            list.innerHTML = '';
            CRAFT_RECIPES.forEach(r => {
                let reqStr = Object.keys(r.req).map(k => `${ITEMS_DB[k]?.name || k}x${r.req[k]}`).join(', ');
                const el = document.createElement('div');
                el.className = 'bg-pink-50 border-2 border-pink-300 rounded-2xl p-3 flex justify-between items-center';
                el.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-3xl">${r.icon}</span>
                        <div>
                            <div class="font-black text-xs text-pink-900">${r.name}</div>
                            <div class="text-[10px] text-pink-700 font-bold">必要: ${reqStr}</div>
                        </div>
                    </div>
                    <button onclick="craftItem('${r.id}')" class="btn-cute-pink px-3 py-1.5 rounded-xl text-xs font-bold text-white">DIYする</button>
                `;
                list.appendChild(el);
            });
        }

        window.craftItem = function(recipeId) {
            const recipe = CRAFT_RECIPES.find(r => r.id === recipeId);
            let canCraft = true;
            for (let k in recipe.req) {
                let inv = playerState.inventory.find(i => i.id === k);
                if (!inv || inv.count < recipe.req[k]) canCraft = false;
            }
            if (canCraft) {
                for (let k in recipe.req) {
                    let inv = playerState.inventory.find(i => i.id === k);
                    inv.count -= recipe.req[k];
                }
                addItem(recipe.id, recipe.count || 1);
                audio.playCatch();
                showToast('🔨 DIY大成功！', recipe.name);
                renderCraft();
            } else { showToast('❌ 材料がたりないよ！', ''); }
        };

        document.getElementById('btn-book').addEventListener('click', () => {
            renderBookPedia();
            document.getElementById('modal-book').classList.remove('hidden');
        });
        document.getElementById('close-book').addEventListener('click', () => {
            document.getElementById('modal-book').classList.add('hidden');
        });

        window.switchBookTab = function(tab) {
            if (tab === 'pedia') renderBookPedia();
            else renderMuseumDonation();
        };

        function renderBookPedia() {
            const grid = document.getElementById('book-grid');
            grid.innerHTML = '';
            Object.keys(ITEMS_DB).forEach(key => {
                const item = ITEMS_DB[key];
                if (['fish', 'bug', 'fossil'].includes(item.category)) {
                    const isCaught = playerState.critterpedia[key];
                    const card = document.createElement('div');
                    card.className = `p-3 rounded-2xl border-2 flex flex-col items-center justify-center text-center ${isCaught ? 'bg-pink-50 border-pink-300' : 'bg-slate-100 border-slate-200 opacity-50'}`;
                    card.innerHTML = `
                        <span class="text-3xl">${isCaught ? item.icon : '❓'}</span>
                        <span class="text-xs font-black text-pink-900 mt-1">${isCaught ? item.name : '？？？'}</span>
                    `;
                    grid.appendChild(card);
                }
            });
        }

        function renderMuseumDonation() {
            const grid = document.getElementById('book-grid');
            grid.innerHTML = '';
            playerState.inventory.forEach(inv => {
                const db = ITEMS_DB[inv.id];
                if (db && ['fish', 'bug', 'fossil'].includes(db.category)) {
                    const card = document.createElement('div');
                    card.className = 'bg-pink-50 border-2 border-pink-300 rounded-2xl p-3 flex flex-col items-center justify-center text-center';
                    card.innerHTML = `
                        <span class="text-3xl">${db.icon}</span>
                        <span class="text-xs font-black text-pink-900 mt-1">${db.name}</span>
                        <button onclick="donateItem('${inv.id}')" class="mt-2 btn-cute-pink px-2.5 py-1 rounded-xl text-[10px] font-bold text-white">寄贈する</button>
                    `;
                    grid.appendChild(card);
                }
            });
            if (grid.children.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center text-pink-800 text-xs font-bold py-6">寄贈できる魚・虫・化石を持っていません</div>';
            }
        }

        window.donateItem = function(id) {
            let inv = playerState.inventory.find(i => i.id === id);
            if (inv && inv.count > 0) {
                inv.count--;
                playerState.museumDonations[id] = true;
                if (inv.count === 0) playerState.inventory = playerState.inventory.filter(i => i.id !== id);
                audio.playBell();
                showToast('🏛️ 博物館に寄贈したよ！', '');
                renderMuseumDonation();
            }
        };

        function openMuseumModal() {
            renderMuseumDonation();
            document.getElementById('modal-book').classList.remove('hidden');
        }

        function openShopModal() {
            const container = document.getElementById('shop-content');
            container.innerHTML = '';
            playerState.inventory.forEach(inv => {
                const db = ITEMS_DB[inv.id];
                if (db) {
                    const row = document.createElement('div');
                    row.className = 'bg-pink-50 border-2 border-pink-300 rounded-2xl p-3 flex justify-between items-center';
                    row.innerHTML = `
                        <div class="flex items-center gap-2">
                            <span class="text-2xl">${db.icon}</span>
                            <div>
                                <div class="font-black text-xs text-pink-900">${db.name}</div>
                                <div class="text-[10px] text-pink-700">買取: ${db.price} ベル (x${inv.count})</div>
                            </div>
                        </div>
                        <button onclick="sellItem('${inv.id}')" class="btn-cute-pink px-3 py-1.5 rounded-xl text-xs font-bold text-white">1個売る</button>
                    `;
                    container.appendChild(row);
                }
            });
            document.getElementById('modal-shop').classList.remove('hidden');
        }

        window.sellItem = function(id) {
            let inv = playerState.inventory.find(i => i.id === id);
            if (inv && inv.count > 0) {
                inv.count--;
                playerState.bells += ITEMS_DB[id].price;
                if (inv.count === 0) playerState.inventory = playerState.inventory.filter(i => i.id !== id);
                audio.playBell();
                showToast('✨ お店で売却したよ！', `+${ITEMS_DB[id].price}ベル`);
                document.getElementById('hud-bells').innerText = `${playerState.bells.toLocaleString()} ベル`;
                openShopModal();
            }
        };

        document.getElementById('close-shop').addEventListener('click', () => {
            document.getElementById('modal-shop').classList.add('hidden');
        });

        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                playerState.activeTool = e.currentTarget.dataset.tool;
                document.querySelectorAll('.tool-btn').forEach(b => {
                    b.classList.remove('bg-pink-300', 'border-pink-600');
                    b.classList.add('bg-pink-50', 'border-pink-300');
                });
                e.currentTarget.classList.remove('bg-pink-50', 'border-pink-300');
                e.currentTarget.classList.add('bg-pink-300', 'border-pink-600');
            });
        });

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-icon').innerText = title.split(' ')[0];
            document.getElementById('toast-msg').innerText = `${title} ${msg}`;
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2200);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            console.log('① STARTクリック');

            audio.init();
            console.log('② audio.init OK');

            initThree();
            console.log('③ initThree OK');

            animate();
            console.log('④ animate OK');

            document.getElementById('start-screen').classList.add('hidden');
            console.log('⑤ start-screen hidden');
        });

        document.getElementById('btn-action').addEventListener('click', () => {
            performAction();
        });
</script>
